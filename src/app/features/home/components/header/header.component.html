<header class="header">
  <div class="header-container">

    <!-- Logo -->
    <a class="logo" href="/">
      <span class="logo-icon">N</span>
      <span class="logo-text">NEXORA</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="navigation">
      <a href="#home" class="nav-link active">Inicio</a>
      <a href="#products" class="nav-link">Productos</a>
      <a href="#categories" class="nav-link">Categorías</a>
      <a href="#offers" class="nav-link">Ofertas</a>
    </nav>

    <!-- Actions -->
    <div class="header-actions">

      <!-- Search -->
      <button class="icon-button" aria-label="Buscar">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </button>

      <!-- User -->
      <button class="icon-button" aria-label="Mi cuenta">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
        </svg>
      </button>

      <!-- Cart -->
      <button class="cart-button" aria-label="Carrito">
        <svg viewBox="0 0 24 24">
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"></path>
          <circle cx="10" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
        </svg>

        <span class="cart-count">0</span>
      </button>

      <!-- Mobile menu -->
      <button
        class="menu-button"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </div>

  <!-- Mobile Navigation -->
  @if (menuOpen()) {
    <nav class="mobile-navigation">
      <a href="#home" (click)="closeMenu()">Inicio</a>
      <a href="#products" (click)="closeMenu()">Productos</a>
      <a href="#categories" (click)="closeMenu()">Categorías</a>
      <a href="#offers" (click)="closeMenu()">Ofertas</a>
    </nav>
  }
</header>
