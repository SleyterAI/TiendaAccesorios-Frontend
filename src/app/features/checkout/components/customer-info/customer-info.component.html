<div class="card section-card">
  <h3 class="section-heading">Información usuario</h3>
  <div class="form-grid">
    <div class="input-group">
      <label for="name">Nombre:</label>
      <input id="name" type="text"

        [(ngModel)]="name" placeholder="Nombre" />
    </div>
    <div class="input-group">
      <label for="lastName">Apellido:</label>
      <input id="lastName" type="text"

        [(ngModel)]="lastName" placeholder="Apellido completo" />
    </div>
    <div class="input-group">
      <label for="address">Dirección:</label>
      <input id="address" type="text"

        [(ngModel)]="address" placeholder="Direccion" />
    </div>
    <div class="input-group">
      <label for="email">Celular:</label>
      <input id="email" type="email"

        [(ngModel)]="phoneNumber" placeholder="Numero de celular" />
    </div>
  </div>
</div>
